[project]
name = "wallet-rest-cli"
version = "0.0.2"
description = "Console CLI for querying the BudgetBakers Wallet API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "typer[all]>=0.12",
]
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" }
]


[project.scripts]
wallet-rest-cli = "wallet_rest_cli.cli:main"

[dependency-groups]
lint = [
    "hatch>=1.16.5",
    "black>=24.0",
    "mypy>=1.10",
    "ruff>=0.6",
]
test = [
    "hatch>=1.16.5",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.uv]
exclude-newer = "30 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_rest_cli"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "black ."
lint-check = "ruff check ."
format-check = "black --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format-check", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/wallet_rest_cli"]
omit = [
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.mypy]
python_version = "3.11"
strict = true
incremental = false
check_untyped_defs = true
files = ["src"]
exclude = ["tests/"]

[tool.black]
line-length = 79

[tool.ruff]
line-length = 79
