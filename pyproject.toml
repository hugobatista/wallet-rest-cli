[project]
name = "wallet-rest-cli"
version = "0.0.3"
description = "Console CLI for querying the BudgetBakers Wallet API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "typer[all]>=0.12",
]
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" }
]


[project.scripts]
wallet-rest-cli = "wallet_rest_cli.cli:main"

[dependency-groups]
lint = [
    "mypy>=1.10",
    "ruff>=0.6",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
]
dev = [
    "hatch>=1.16.5",
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.uv]
required-version = "0.11.18"
exclude-newer = "30 days"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_rest_cli"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.pytest.ini_options]
addopts = "--tb=short --strict-markers --cov --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/wallet_rest_cli"]
omit = [
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
incremental = false
check_untyped_defs = true
files = ["src"]
exclude = ["tests/"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
